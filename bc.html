<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>便签与待办</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #FAF7F3;
            color: #2D2A26;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* ===== 主容器 ===== */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            background-color: #FAF7F3;
            position: relative;
            overflow: hidden;
        }

        /* ===== 视图容器 ===== */
        .view {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
            padding-bottom: 64px;
            /* 为底部tab留空间 */;
        }

        .view.active {
            display: flex;
        }

        /* ===== 视图头部 ===== */
        .view-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 12px 20px;
            background-color: #FAF7F3;
            flex-shrink: 0;
            border-bottom: 1px solid #EDE8E1;
        }

        .view-header .title {
            font-size: 20px;
            font-weight: 600;
            color: #2D2A26;
            letter-spacing: 0.5px;
        }

        .view-header .back-btn {
            font-size: 16px;
            color: #2D2A26;
            cursor: pointer;
            padding: 6px 12px;
            background: none;
            border: none;
            font-weight: 400;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .view-header .back-btn:active {
            background-color: rgba(0, 0, 0, 0.06);
        }

        .view-header .header-action {
            font-size: 22px;
            font-weight: 300;
            color: #2D2A26;
            cursor: pointer;
            padding: 4px 10px;
            background: none;
            border: none;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .view-header .header-action:active {
            background-color: rgba(0, 0, 0, 0.06);
        }
        .view-header .header-action.confirm {
            font-size: 24px;
            font-weight: 400;
            color: #FF6700;
        }

        /* ===== 列表容器 ===== */
        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 20px 16px;
            -webkit-overflow-scrolling: touch;
        }

        .list-container::-webkit-scrollbar {
            width: 0;
            background: transparent;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #B5ADA3;
            font-size: 15px;
            letter-spacing: 0.3px;
            padding: 40px 20px;
            text-align: center;
        }
        .empty-state .empty-icon {
            width: 56px;
            height: 56px;
            margin-bottom: 16px;
            opacity: 0.3;
            border-radius: 50%;
            background-color: #EDE8E1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #B5ADA3;
        }

        /* ===== 笔记卡片 ===== */
        .note-card {
            background-color: #FFFFFF;
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.02);
            transition: box-shadow 0.25s ease;
            cursor: pointer;
            border: 1px solid #F0EBE5;
        }
        .note-card:active {
            background-color: #F8F5F0;
        }

        .note-card .note-title {
            font-size: 17px;
            font-weight: 600;
            color: #2D2A26;
            line-height: 1.4;
            word-break: break-word;
        }

        .note-card .note-preview {
            font-size: 14px;
            color: #9A9288;
            margin-top: 4px;
            line-height: 1.5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: break-word;
        }

        .note-card .note-body {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #F0EBE5;
            font-size: 15px;
            line-height: 1.8;
            color: #2D2A26;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .note-card .note-body .line {
            display: block;
        }

        .note-card .note-meta {
            font-size: 12px;
            color: #C5BDB3;
            margin-top: 8px;
            text-align: right;
        }

        /* ===== 待办项 ===== */
        .todo-item {
            display: flex;
            align-items: center;
            background-color: #FFFFFF;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            border: 1px solid #F0EBE5;
            transition: background 0.2s;
        }
        .todo-item:active {
            background-color: #F8F5F0;
        }

        .todo-item .todo-check {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #D5CFC7;
            background-color: #FFFFFF;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            position: relative;
        }
        .todo-item .todo-check:active {
            transform: scale(0.92);
        }
        .todo-item .todo-check.checked {
            border-color: #FF6700;
            background-color: #FF6700;
        }
        .todo-item .todo-check.checked::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 6px;
            border-left: 2.5px solid #FFFFFF;
            border-bottom: 2.5px solid #FFFFFF;
            transform: rotate(-45deg) translate(1px, -1px);
        }

        .todo-item .todo-text {
            flex: 1;
            font-size: 16px;
            color: #2D2A26;
            line-height: 1.4;
            word-break: break-word;
        }

        /* ===== 回收站项 ===== */
        .trash-item {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            background-color: #FFFFFF;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            border: 1px solid #F0EBE5;
        }

        .trash-item .trash-text {
            flex: 1;
            min-width: 120px;
            font-size: 15px;
            color: #2D2A26;
            line-height: 1.4;
            word-break: break-word;
            margin-right: 10px;
        }

        .trash-item .trash-time {
            font-size: 12px;
            color: #B5ADA3;
            width: 100%;
            margin-top: 4px;
            margin-bottom: 8px;
        }

        .trash-item .trash-actions {
            display: flex;
            gap: 8px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .trash-item .trash-actions button {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            background-color: #F0EBE5;
            color: #2D2A26;
            min-height: 36px;
        }
        .trash-item .trash-actions button:active {
            background-color: #E0D8D0;
        }
        .trash-item .trash-actions .btn-restore {
            background-color: #FF6700;
            color: #FFFFFF;
        }
        .trash-item .trash-actions .btn-restore:active {
            background-color: #E05C00;
        }
        .trash-item .trash-actions .btn-delete {
            background-color: #E8E0D8;
            color: #6B5F54;
        }
        .trash-item .trash-actions .btn-delete:active {
            background-color: #D5CDC3;
        }

        /* ===== 底部Tab栏 ===== */
        .bottom-tab {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #FFFFFF;
            border-top: 1px solid #EDE8E1;
            height: 56px;
            flex-shrink: 0;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 10;
        }

        .bottom-tab .tab-item {
            flex: 1;
            text-align: center;
            font-size: 16px;
            font-weight: 400;
            color: #B5ADA3;
            padding: 8px 0;
            cursor: pointer;
            transition: color 0.2s, font-weight 0.2s;
            letter-spacing: 0.5px;
            border: none;
            background: none;
            position: relative;
        }
        .bottom-tab .tab-item:active {
            opacity: 0.6;
        }
        .bottom-tab .tab-item.active {
            color: #FF6700;
            font-weight: 600;
        }
        .bottom-tab .tab-item.active::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 3px;
            background-color: #FF6700;
            border-radius: 2px;
        }

        /* ===== 浮动按钮 ===== */
        .fab-wrapper {
            position: absolute;
            bottom: 72px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 20;
        }

        .fab-wrapper .fab-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background-color: #FF6700;
            color: #FFFFFF;
            font-size: 30px;
            font-weight: 300;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 103, 0, 0.30);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .fab-wrapper .fab-btn:active {
            transform: scale(0.92);
            box-shadow: 0 2px 6px rgba(255, 103, 0, 0.25);
        }

        .fab-wrapper .fab-btn.trash-btn {
            background-color: #EDE8E1;
            color: #6B5F54;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            width: 46px;
            height: 46px;
            font-size: 0;
            padding: 0;
        }
        .fab-wrapper .fab-btn.trash-btn:active {
            background-color: #E0D8D0;
            transform: scale(0.92);
        }

        .fab-wrapper .fab-btn.trash-btn svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #6B5F54;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.35);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 24px;
            backdrop-filter: blur(2px);
        }
        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background-color: #FFFFFF;
            border-radius: 16px;
            padding: 28px 24px 24px 24px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            animation: modalIn 0.25s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-box .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #2D2A26;
            margin-bottom: 16px;
            text-align: center;
        }

        .modal-box .modal-input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #EDE8E1;
            border-radius: 10px;
            font-size: 16px;
            background-color: #FAF7F3;
            color: #2D2A26;
            outline: none;
            transition: border-color 0.25s;
            font-family: inherit;
            min-height: 48px;
        }
        .modal-box .modal-input:focus {
            border-color: #FF6700;
        }
        .modal-box .modal-input::placeholder {
            color: #C5BDB3;
        }

        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            justify-content: flex-end;
        }

        .modal-box .modal-actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            min-height: 44px;
            min-width: 72px;
        }
        .modal-box .modal-actions .btn-cancel {
            background-color: #F0EBE5;
            color: #2D2A26;
        }
        .modal-box .modal-actions .btn-cancel:active {
            background-color: #E0D8D0;
        }
        .modal-box .modal-actions .btn-confirm {
            background-color: #FF6700;
            color: #FFFFFF;
        }
        .modal-box .modal-actions .btn-confirm:active {
            background-color: #E05C00;
        }

        /* ===== 笔记编辑页 ===== */
        #noteEditView .edit-content {
            flex: 1;
            padding: 16px 20px 20px 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #noteEditView .edit-content .edit-title {
            width: 100%;
            padding: 12px 0 10px 0;
            border: none;
            border-bottom: 2px solid #EDE8E1;
            font-size: 20px;
            font-weight: 600;
            background-color: transparent;
            color: #2D2A26;
            outline: none;
            transition: border-color 0.25s;
            font-family: inherit;
            margin-bottom: 16px;
        }
        #noteEditView .edit-content .edit-title:focus {
            border-bottom-color: #FF6700;
        }
        #noteEditView .edit-content .edit-title::placeholder {
            color: #C5BDB3;
            font-weight: 400;
        }

        #noteEditView .edit-content .edit-body {
            width: 100%;
            padding: 10px 0;
            border: none;
            font-size: 16px;
            line-height: 1.8;
            background-color: transparent;
            color: #2D2A26;
            outline: none;
            resize: none;
            font-family: inherit;
            min-height: 200px;
        }
        #noteEditView .edit-content .edit-body::placeholder {
            color: #C5BDB3;
        }

        /* ===== 隐藏辅助 ===== */
        .hidden {
            display: none !important;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            #app {
                max-width: 100%;
            }
            .fab-wrapper {
                right: 16px;
                bottom: 68px;
            }
            .fab-wrapper .fab-btn {
                width: 48px;
                height: 48px;
                font-size: 26px;
            }
            .fab-wrapper .fab-btn.trash-btn {
                width: 42px;
                height: 42px;
            }
            .fab-wrapper .fab-btn.trash-btn svg {
                width: 20px;
                height: 20px;
            }
            .modal-box {
                padding: 24px 18px 20px 18px;
            }
            .view-header {
                padding: 12px 16px 10px 16px;
            }
            .view-header .title {
                font-size: 18px;
            }
            .list-container {
                padding: 8px 12px 16px 12px;
            }
            .note-card {
                padding: 14px 16px;
            }
            .todo-item {
                padding: 12px 14px;
            }
            .trash-item {
                padding: 12px 14px;
            }
            .trash-item .trash-actions button {
                padding: 4px 12px;
                font-size: 13px;
                min-height: 32px;
            }
            .bottom-tab {
                height: 50px;
            }
            .bottom-tab .tab-item {
                font-size: 15px;
            }
            .modal-box .modal-actions button {
                padding: 8px 18px;
                font-size: 15px;
                min-height: 40px;
                min-width: 64px;
            }
        }

        @media (max-width: 380px) {
            .fab-wrapper {
                right: 12px;
                bottom: 62px;
            }
            .fab-wrapper .fab-btn {
                width: 42px;
                height: 42px;
                font-size: 22px;
            }
            .fab-wrapper .fab-btn.trash-btn {
                width: 38px;
                height: 38px;
            }
            .fab-wrapper .fab-btn.trash-btn svg {
                width: 18px;
                height: 18px;
            }
            .trash-item .trash-actions {
                flex-wrap: wrap;
                width: 100%;
                justify-content: flex-end;
                margin-top: 6px;
            }
            .trash-item .trash-actions button {
                padding: 4px 10px;
                font-size: 12px;
                min-height: 30px;
            }
        }

        /* ===== 安全区域 ===== */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .bottom-tab {
                padding-bottom: env(safe-area-inset-bottom);
                height: calc(56px + env(safe-area-inset-bottom));
            }
            .fab-wrapper {
                bottom: calc(72px + env(safe-area-inset-bottom));
            }
            .view {
                padding-bottom: calc(64px + env(safe-area-inset-bottom));
            }
            @media (max-width: 480px) {
                .fab-wrapper {
                    bottom: calc(68px + env(safe-area-inset-bottom));
                }
            }
            @media (max-width: 380px) {
                .fab-wrapper {
                    bottom: calc(62px + env(safe-area-inset-bottom));
                }
            }
        }
    </style>
</head>
<body>

    <div id="app">

        <!-- ==================== 笔记列表视图 ==================== -->
        <div id="notesView" class="view active">
            <div class="view-header">
                <span class="title">笔记</span>
                <span style="width:48px;"></span>
            </div>
            <div class="list-container" id="notesList">
                <!-- 动态渲染 -->
            </div>
            <!-- FAB -->
            <div class="fab-wrapper" id="notesFab">
                <button class="fab-btn trash-btn" id="trashEntryBtn" aria-label="回收站">
                    <svg viewBox="0 0 24 24">
                        <path d="M3 6h18" />
                        <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                        <line x1="10" y1="11" x2="10" y2="17" />
                        <line x1="14" y1="11" x2="14" y2="17" />
                    </svg>
                </button>
                <button class="fab-btn" id="noteAddBtn">+</button>
            </div>
        </div>

        <!-- ==================== 笔记编辑视图 ==================== -->
        <div id="noteEditView" class="view">
            <div class="view-header">
                <button class="back-btn" id="noteEditCancel">取消</button>
                <span class="title" style="font-size:17px;font-weight:500;">编辑笔记</span>
                <button class="header-action confirm" id="noteEditSave">✓</button>
            </div>
            <div class="edit-content">
                <input class="edit-title" id="noteEditTitle" placeholder="请填写标题" maxlength="200" />
                <textarea class="edit-body" id="noteEditBody" placeholder="请填写内容"></textarea>
            </div>
        </div>

        <!-- ==================== 待办列表视图 ==================== -->
        <div id="todosView" class="view">
            <div class="view-header">
                <span class="title">待办</span>
                <span style="width:48px;"></span>
            </div>
            <div class="list-container" id="todosList">
                <!-- 动态渲染 -->
            </div>
            <div class="fab-wrapper" id="todosFab">
                <button class="fab-btn" id="todoAddBtn">+</button>
            </div>
        </div>

        <!-- ==================== 回收站视图 ==================== -->
        <div id="trashView" class="view">
            <div class="view-header">
                <button class="back-btn" id="trashBackBtn">← 返回</button>
                <span class="title">回收站</span>
                <span style="width:48px;"></span>
            </div>
            <div class="list-container" id="trashList">
                <!-- 动态渲染 -->
            </div>
        </div>

        <!-- ==================== 底部Tab栏 ==================== -->
        <div class="bottom-tab" id="bottomTab">
            <button class="tab-item active" data-tab="notes">笔记</button>
            <button class="tab-item" data-tab="todos">待办</button>
        </div>

        <!-- ==================== 模态框（添加待办） ==================== -->
        <div class="modal-overlay" id="todoModal">
            <div class="modal-box">
                <div class="modal-title">新建待办</div>
                <input class="modal-input" id="todoModalInput" placeholder="请输入待办内容" maxlength="200" autofocus />
                <div class="modal-actions">
                    <button class="btn-cancel" id="todoModalCancel">取消</button>
                    <button class="btn-confirm" id="todoModalConfirm">确认</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  数据层
            // ============================================================

            const STORAGE_KEY = 'note_todo_data';

            // 默认数据结构
            function getDefaultData() {
                return {
                    notes: [],
                    todos: [] // { id, text, deletedAt: null | timestamp }
                };
            }

            let data = loadData();

            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (parsed && typeof parsed === 'object') {
                            if (!Array.isArray(parsed.notes)) parsed.notes = [];
                            if (!Array.isArray(parsed.todos)) parsed.todos = [];
                            return parsed;
                        }
                    }
                } catch (_) { /* ignore */ }
                return getDefaultData();
            }

            function saveData() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (_) { /* ignore */ }
            }

            // 工具：生成短id
            function genId() {
                return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
            }

            // 工具：格式化相对时间
            function timeAgo(ts) {
                const diff = Date.now() - ts;
                const seconds = Math.floor(diff / 1000);
                if (seconds < 60) return '刚刚';
                const minutes = Math.floor(seconds / 60);
                if (minutes < 60) return minutes + '分钟前';
                const hours = Math.floor(minutes / 60);
                if (hours < 24) return hours + '小时前';
                const days = Math.floor(hours / 24);
                if (days < 30) return days + '天前';
                const months = Math.floor(days / 30);
                if (months < 12) return months + '个月前';
                return Math.floor(months / 12) + '年前';
            }

            // ============================================================
            //  笔记操作
            // ============================================================

            function getNotes() {
                return data.notes.slice().sort((a, b) => (b.updatedAt || b.createdAt) - (a.updatedAt || a.createdAt));
            }

            function createNote(title, content) {
                const now = Date.now();
                const note = {
                    id: genId(),
                    title: title.trim() || '无标题',
                    content: content || '',
                    createdAt: now,
                    updatedAt: now
                };
                data.notes.push(note);
                saveData();
                return note;
            }

            function updateNote(id, title, content) {
                const note = data.notes.find(n => n.id === id);
                if (!note) return null;
                note.title = title.trim() || '无标题';
                note.content = content || '';
                note.updatedAt = Date.now();
                saveData();
                return note;
            }

            function deleteNote(id) {
                data.notes = data.notes.filter(n => n.id !== id);
                saveData();
            }

            function getNote(id) {
                return data.notes.find(n => n.id === id) || null;
            }

            // ============================================================
            //  待办操作
            // ============================================================

            function getActiveTodos() {
                return data.todos.filter(t => t.deletedAt === null)
                    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
            }

            function getTrashedTodos() {
                return data.todos.filter(t => t.deletedAt !== null)
                    .sort((a, b) => (b.deletedAt || 0) - (a.deletedAt || 0));
            }

            function createTodo(text) {
                const now = Date.now();
                const todo = {
                    id: genId(),
                    text: text.trim(),
                    deletedAt: null,
                    createdAt: now
                };
                data.todos.push(todo);
                saveData();
                return todo;
            }

            function completeTodo(id) {
                const todo = data.todos.find(t => t.id === id);
                if (!todo || todo.deletedAt !== null) return false;
                todo.deletedAt = Date.now();
                saveData();
                return true;
            }

            function restoreTodo(id) {
                const todo = data.todos.find(t => t.id === id);
                if (!todo || todo.deletedAt === null) return false;
                todo.deletedAt = null;
                saveData();
                return true;
            }

            function permanentDeleteTodo(id) {
                data.todos = data.todos.filter(t => t.id !== id);
                saveData();
                return true;
            }

            // 清理过期（30天）
            function cleanExpiredTrash() {
                const now = Date.now();
                const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;
                let changed = false;
                data.todos = data.todos.filter(t => {
                    if (t.deletedAt !== null && (now - t.deletedAt) >= THIRTY_DAYS) {
                        changed = true;
                        return false;
                    }
                    return true;
                });
                if (changed) {
                    saveData();
                    renderAll();
                }
            }

            // ============================================================
            //  渲染函数
            // ============================================================

            // 笔记展开状态
            const expandedNotes = new Set();

            function renderNotes() {
                const container = document.getElementById('notesList');
                const notes = getNotes();

                if (notes.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">+</div>
                            <div>暂无笔记，点击右下角添加</div>
                        </div>
                    `;
                    return;
                }

                let html = '';
                for (const note of notes) {
                    const isExpanded = expandedNotes.has(note.id);
                    const preview = note.content ? note.content.slice(0, 40) : '';
                    const previewSuffix = note.content && note.content.length > 40 ? '…' : '';

                    // 构建展开内容（按行缩进）
                    let bodyHtml = '';
                    if (isExpanded && note.content) {
                        const lines = note.content.split('\n');
                        // 过滤掉末尾空行，但保留中间空行
                        const filteredLines = lines;
                        // 如果所有行都是空，不显示
                        const hasContent = filteredLines.some(l => l.trim() !== '');
                        if (hasContent) {
                            bodyHtml = '<div class="note-body">';
                            for (let i = 0; i < filteredLines.length; i++) {
                                const line = filteredLines[i];
                                const indent = i * 2; // 2个中文字符宽度
                                const style = indent > 0 ? ` style="padding-left:${indent}em;"` : '';
                                // 空行保留占位
                                const displayLine = line || '\u200B';
                                bodyHtml += `<span class="line"${style}>${escapeHtml(displayLine)}</span>`;
                            }
                            bodyHtml += '</div>';
                        }
                    }

                    const timeStr = timeAgo(note.updatedAt || note.createdAt);

                    html += `
                        <div class="note-card" data-id="${note.id}">
                            <div class="note-title">${escapeHtml(note.title)}</div>
                            ${preview ? `<div class="note-preview">${escapeHtml(preview)}${previewSuffix}</div>` : ''}
                            ${bodyHtml}
                            <div class="note-meta">${timeStr}</div>
                        </div>
                    `;
                }

                container.innerHTML = html;

                // 绑定事件（委托）
                container.querySelectorAll('.note-card').forEach(card => {
                    const id = card.dataset.id;
                    // 单击展开/折叠
                    card.addEventListener('click', function(e) {
                        // 如果点击的是内部按钮等，忽略
                        if (e.target.closest('.note-body')) return;
                        if (e.target.closest('.note-meta')) return;
                        toggleNoteExpand(id);
                    });
                    // 双击编辑
                    let clickTimer = null;
                    card.addEventListener('click', function(e) {
                        if (e.target.closest('.note-body')) return;
                        if (e.target.closest('.note-meta')) return;
                        if (clickTimer) {
                            clearTimeout(clickTimer);
                            clickTimer = null;
                            // 双击
                            enterEditNote(id);
                            return;
                        }
                        clickTimer = setTimeout(() => {
                            clickTimer = null;
                        }, 280);
                    });
                });
            }

            function toggleNoteExpand(id) {
                if (expandedNotes.has(id)) {
                    expandedNotes.delete(id);
                } else {
                    expandedNotes.add(id);
                }
                renderNotes();
                // 滚动保持
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
            }

            // ============================================================
            //  待办渲染
            // ============================================================

            function renderTodos() {
                const container = document.getElementById('todosList');
                const todos = getActiveTodos();

                if (todos.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">+</div>
                            <div>暂无待办，点击右下角添加</div>
                        </div>
                    `;
                    return;
                }

                let html = '';
                for (const todo of todos) {
                    html += `
                        <div class="todo-item" data-id="${todo.id}">
                            <div class="todo-check" data-id="${todo.id}"></div>
                            <span class="todo-text">${escapeHtml(todo.text)}</span>
                        </div>
                    `;
                }
                container.innerHTML = html;

                // 绑定勾选事件
                container.querySelectorAll('.todo-check').forEach(el => {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        if (completeTodo(id)) {
                            renderTodos();
                            // 如果回收站开着，也刷新
                            if (document.getElementById('trashView').classList.contains('active')) {
                                renderTrash();
                            }
                        }
                    });
                });
            }

            // ============================================================
            //  回收站渲染
            // ============================================================

            function renderTrash() {
                const container = document.getElementById('trashList');
                const items = getTrashedTodos();

                if (items.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">♻</div>
                            <div>回收站为空</div>
                        </div>
                    `;
                    return;
                }

                let html = '';
                for (const item of items) {
                    const timeStr = item.deletedAt ? timeAgo(item.deletedAt) : '未知';
                    html += `
                        <div class="trash-item" data-id="${item.id}">
                            <span class="trash-text">${escapeHtml(item.text)}</span>
                            <span class="trash-time">删除于 ${timeStr}</span>
                            <div class="trash-actions">
                                <button class="btn-restore" data-id="${item.id}">恢复</button>
                                <button class="btn-delete" data-id="${item.id}">永久删除</button>
                            </div>
                        </div>
                    `;
                }
                container.innerHTML = html;

                // 绑定事件
                container.querySelectorAll('.btn-restore').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        if (restoreTodo(id)) {
                            renderTrash();
                            renderTodos();
                            renderNotes(); // 刷新笔记界面的tab标记（无影响）
                        }
                    });
                });

                container.querySelectorAll('.btn-delete').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        if (permanentDeleteTodo(id)) {
                            renderTrash();
                            // 待办列表不受影响，因为已删除的不在待办中
                        }
                    });
                });
            }

            // ============================================================
            //  全量渲染
            // ============================================================

            function renderAll() {
                const activeView = document.querySelector('.view.active');
                const viewId = activeView ? activeView.id : 'notesView';
                renderNotes();
                renderTodos();
                if (document.getElementById('trashView').classList.contains('active')) {
                    renderTrash();
                }
                // 根据当前视图刷新
                switch (viewId) {
                    case 'notesView':
                        renderNotes();
                        break;
                    case 'todosView':
                        renderTodos();
                        break;
                    case 'trashView':
                        renderTrash();
                        break;
                    case 'noteEditView':
                        // 不刷新
                        break;
                }
            }

            // ============================================================
            //  视图切换
            // ============================================================

            function switchView(viewId) {
                // 隐藏所有视图
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                // 显示目标视图
                const target = document.getElementById(viewId);
                if (target) target.classList.add('active');

                // 显示/隐藏底部Tab
                const tab = document.getElementById('bottomTab');
                if (viewId === 'notesView' || viewId === 'todosView') {
                    tab.style.display = 'flex';
                } else {
                    tab.style.display = 'none';
                }

                // 显示/隐藏FAB
                const notesFab = document.getElementById('notesFab');
                const todosFab = document.getElementById('todosFab');
                if (viewId === 'notesView') {
                    notesFab.style.display = 'flex';
                    todosFab.style.display = 'none';
                } else if (viewId === 'todosView') {
                    notesFab.style.display = 'none';
                    todosFab.style.display = 'flex';
                } else {
                    notesFab.style.display = 'none';
                    todosFab.style.display = 'none';
                }

                // 刷新对应内容
                if (viewId === 'notesView') renderNotes();
                if (viewId === 'todosView') renderTodos();
                if (viewId === 'trashView') renderTrash();

                // 更新Tab高亮
                document.querySelectorAll('.tab-item').forEach(tabItem => {
                    tabItem.classList.toggle('active', tabItem.dataset.tab === (viewId === 'notesView' ? 'notes' :
                        viewId === 'todosView' ? 'todos' : ''));
                });
            }

            // ============================================================
            //  笔记编辑逻辑
            // ============================================================

            let editingNoteId = null;

            function enterEditNote(id) {
                const note = getNote(id);
                if (!note) return;
                editingNoteId = id;
                document.getElementById('noteEditTitle').value = note.title || '';
                document.getElementById('noteEditBody').value = note.content || '';
                switchView('noteEditView');
                // 聚焦标题
                setTimeout(() => {
                    document.getElementById('noteEditTitle').focus();
                    document.getElementById('noteEditTitle').select();
                }, 100);
            }

            function enterNewNote() {
                editingNoteId = null;
                document.getElementById('noteEditTitle').value = '';
                document.getElementById('noteEditBody').value = '';
                switchView('noteEditView');
                setTimeout(() => {
                    document.getElementById('noteEditTitle').focus();
                }, 100);
            }

            function saveNoteEdit() {
                const title = document.getElementById('noteEditTitle').value.trim();
                const content = document.getElementById('noteEditBody').value;

                // 若标题和内容都为空，不保存
                if (!title && !content.trim()) {
                    switchView('notesView');
                    return;
                }

                if (editingNoteId) {
                    // 更新
                    updateNote(editingNoteId, title || '无标题', content);
                } else {
                    // 新建
                    createNote(title || '无标题', content);
                }
                switchView('notesView');
                renderNotes();
            }

            function cancelNoteEdit() {
                switchView('notesView');
            }

            // ============================================================
            //  待办模态框
            // ============================================================

            function showTodoModal() {
                const modal = document.getElementById('todoModal');
                const input = document.getElementById('todoModalInput');
                modal.classList.add('active');
                input.value = '';
                setTimeout(() => {
                    input.focus();
                }, 150);
            }

            function hideTodoModal() {
                document.getElementById('todoModal').classList.remove('active');
            }

            function confirmTodo() {
                const input = document.getElementById('todoModalInput');
                const text = input.value.trim();
                if (!text) {
                    input.focus();
                    input.style.borderColor = '#E05C00';
                    setTimeout(() => { input.style.borderColor = ''; }, 400);
                    return;
                }
                createTodo(text);
                hideTodoModal();
                renderTodos();
                // 如果回收站开着，刷新（不影响）
                if (document.getElementById('trashView').classList.contains('active')) {
                    renderTrash();
                }
            }

            // ============================================================
            //  回收站入口
            // ============================================================

            function openTrash() {
                switchView('trashView');
                renderTrash();
            }

            // ============================================================
            //  事件绑定
            // ============================================================

            function init() {
                // ----- Tab切换 -----
                document.querySelectorAll('.tab-item').forEach(tab => {
                    tab.addEventListener('click', function() {
                        const tabName = this.dataset.tab;
                        if (tabName === 'notes') {
                            switchView('notesView');
                        } else if (tabName === 'todos') {
                            switchView('todosView');
                        }
                    });
                });

                // ----- 笔记添加 -----
                document.getElementById('noteAddBtn').addEventListener('click', enterNewNote);

                // ----- 笔记编辑保存/取消 -----
                document.getElementById('noteEditSave').addEventListener('click', saveNoteEdit);
                document.getElementById('noteEditCancel').addEventListener('click', cancelNoteEdit);

                // 键盘快捷键：Ctrl+Enter 保存
                document.getElementById('noteEditBody').addEventListener('keydown', function(e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                        e.preventDefault();
                        saveNoteEdit();
                    }
                });

                // ----- 待办添加 -----
                document.getElementById('todoAddBtn').addEventListener('click', showTodoModal);

                // ----- 模态框 -----
                document.getElementById('todoModalConfirm').addEventListener('click', confirmTodo);
                document.getElementById('todoModalCancel').addEventListener('click', hideTodoModal);
                document.getElementById('todoModalInput').addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        confirmTodo();
                    }
                    if (e.key === 'Escape') {
                        hideTodoModal();
                    }
                });
                // 点击模态框外部关闭
                document.getElementById('todoModal').addEventListener('click', function(e) {
                    if (e.target === this) {
                        hideTodoModal();
                    }
                });

                // ----- 回收站 -----
                document.getElementById('trashEntryBtn').addEventListener('click', openTrash);
                document.getElementById('trashBackBtn').addEventListener('click', function() {
                    switchView('notesView');
                });

                // ----- 启动定时清理（每分钟检查） -----
                setInterval(cleanExpiredTrash, 60 * 1000);
                // 启动时立即检查一次
                setTimeout(cleanExpiredTrash, 500);

                // ----- 初始渲染 -----
                switchView('notesView');
                renderNotes();
                renderTodos();

                // 监听页面可见性变化时清理
                document.addEventListener('visibilitychange', function() {
                    if (!document.hidden) {
                        cleanExpiredTrash();
                        renderAll();
                    }
                });

                // 防止双击选中文本
                document.addEventListener('mousedown', function(e) {
                    if (e.detail > 1) e.preventDefault();
                }, { passive: false });

                console.log('📝 便签与待办已启动');
            }

            // ============================================================
            //  启动
            // ============================================================

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
