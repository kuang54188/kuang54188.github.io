<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>便签管理</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0ece6;
            color: #2D2A26;
            user-select: none;
            -webkit-user-select: none;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0; /* 去掉了外部边距 */
            margin: 0;
        }
        .app {
            -webkit-touch-callout: none;
        }

        /* ===== 容器 ===== */
        .app {
            width: 100%;
            max-width: 100%; /* 全宽 */
            height: 100vh; /* 全高 */
            background: #FAF7F3;
            border-radius: 0; /* 无圆角 */
            box-shadow: none; /* 无阴影 */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ===== 主内容区 ===== */
        .main-content {
            flex: 1;
            overflow: hidden;
            position: relative;
            padding: 12px 12px 4px 12px; /* 减小内边距 */
            display: flex;
            flex-direction: column;
        }

        /* ===== 视图容器 ===== */
        .view {
            display: none;
            flex-direction: column;
            height: 100%;
            animation: viewFadeIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .view.active {
            display: flex;
        }

        @keyframes viewFadeIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 视图头部 ===== */
        .view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(45, 42, 38, 0.06);
            flex-shrink: 0;
        }
        .view-header h2 {
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            font-weight: 600;
            color: #2D2A26;
            letter-spacing: 0.02em;
        }
        .view-header .action-btn {
            background: transparent;
            border: none;
            padding: 6px 14px;
            font-size: clamp(0.8rem, 2.5vw, 0.95rem);
            color: #2D2A26;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease;
            font-weight: 500;
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(45, 42, 38, 0.04);
        }
        .view-header .action-btn:active {
            transform: scale(0.92);
        }
        .view-header .action-btn .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(45, 42, 38, 0.15);
            border-top-color: #FF6700;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .view-header .action-btn.loading .spinner {
            display: inline-block;
        }
        .view-header .action-btn.loading .btn-text {
            opacity: 0.7;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== 列表容器 ===== */
        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0 4px 0;
            margin: 0 -4px;
            padding-right: 4px;
            scroll-behavior: smooth;
        }
        .list-container::-webkit-scrollbar {
            width: 4px;
        }
        .list-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .list-container::-webkit-scrollbar-thumb {
            background: rgba(45, 42, 38, 0.15);
            border-radius: 4px;
        }

        /* ===== 笔记卡片 ===== */
        .notes-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        .note-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 2px 8px rgba(45, 42, 38, 0.04);
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
            border: 1px solid rgba(45, 42, 38, 0.04);
            will-change: transform, opacity;
            opacity: 0;
            transform: translateY(20px);
        }
        .note-card.entered {
            opacity: 1;
            transform: translateY(0);
        }
        .note-card:active {
            transform: scale(0.98);
        }
        .note-card.expanded {
            box-shadow: 0 4px 16px rgba(45, 42, 38, 0.08);
        }
        .note-card .card-title {
            font-size: clamp(0.95rem, 3vw, 1.1rem);
            font-weight: 600;
            color: #2D2A26;
            line-height: 1.4;
            word-break: break-word;
        }
        .note-card .card-preview {
            font-size: clamp(0.82rem, 2.5vw, 0.92rem);
            color: rgba(45, 42, 38, 0.55);
            margin-top: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }
        .note-card .card-detail-wrap {
            overflow: hidden;
            height: 0;
            opacity: 0;
            transition: height 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
        }
        .note-card.expanded .card-detail-wrap {
            height: auto;
            opacity: 1;
        }
        .note-card .card-detail {
            padding-top: 12px;
            font-size: clamp(0.82rem, 2.5vw, 0.92rem);
            color: rgba(45, 42, 38, 0.78);
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            border-top: 1px solid rgba(45, 42, 38, 0.06);
            margin-top: 10px;
        }
        .note-card .card-detail .line {
            display: block;
        }
        .note-card .card-detail .line.indent-0 {
            padding-left: 0;
        }
        .note-card .card-detail .line.indent-2 {
            padding-left: 2em;
        }
        .note-card .card-detail .line.indent-4 {
            padding-left: 4em;
        }
        .note-card .card-time {
            font-size: 0.7rem;
            color: rgba(45, 42, 38, 0.3);
            margin-top: 8px;
            text-align: right;
        }

        /* ===== 待办列表 ===== */
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(45, 42, 38, 0.04);
            border: 1px solid rgba(45, 42, 38, 0.04);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease, box-shadow 0.2s ease;
            will-change: transform, opacity;
            opacity: 0;
            transform: translateX(20px);
        }
        .todo-item.entered {
            opacity: 1;
            transform: translateX(0);
        }
        .todo-item.removing {
            transform: scale(0.8) translateX(-20px);
            opacity: 0;
        }
        .todo-item .checkbox {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid rgba(45, 42, 38, 0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease, border-color 0.2s ease;
            background: #fff;
        }
        .todo-item .checkbox:active {
            transform: scale(0.92);
        }
        .todo-item .checkbox.checked {
            background: #FF6700;
            border-color: #FF6700;
        }
        .todo-item .checkbox.checked::after {
            content: "✓";
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
        }
        .todo-item .todo-text {
            flex: 1;
            font-size: clamp(0.88rem, 2.8vw, 1rem);
            color: #2D2A26;
            word-break: break-word;
            line-height: 1.4;
        }
        .todo-item .todo-text.done {
            text-decoration: line-through;
            color: rgba(45, 42, 38, 0.35);
        }

        /* ===== FAB 按钮组 ===== */
        .fab-group {
            position: absolute;
            bottom: 16px;
            right: 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            z-index: 10;
        }
        .fab {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #FF6700;
            color: #fff;
            border: none;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(255, 103, 0, 0.32);
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            flex-shrink: 0;
        }
        .fab:active {
            transform: scale(0.92);
        }
        .fab-secondary {
            background: rgba(45, 42, 38, 0.08);
            color: #2D2A26;
            box-shadow: 0 2px 8px rgba(45, 42, 38, 0.06);
            font-size: 0;
            width: 44px;
            height: 44px;
        }
        .fab-secondary:active {
            transform: scale(0.92);
        }
        .fab-secondary svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #2D2A26;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ===== 底部 Tab ===== */
        .bottom-tab {
            display: flex;
            border-top: 1px solid rgba(45, 42, 38, 0.06);
            background: #FAF7F3;
            flex-shrink: 0;
            padding: 4px 12px 8px 12px;
            gap: 0;
            position: relative;
            z-index: 5;
        }
        .bottom-tab .tab-item {
            flex: 1;
            text-align: center;
            padding: 10px 0 6px 0;
            font-size: clamp(0.85rem, 2.6vw, 1rem);
            font-weight: 500;
            color: rgba(45, 42, 38, 0.4);
            cursor: pointer;
            border: none;
            background: transparent;
            transition: color 0.2s ease, transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            letter-spacing: 0.03em;
            border-radius: 0;
            user-select: none;
        }
        .bottom-tab .tab-item:active {
            transform: scale(0.92);
        }
        .bottom-tab .tab-item::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 3px;
            border-radius: 3px;
            background: #FF6700;
            transition: width 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .bottom-tab .tab-item.active {
            color: #2D2A26;
        }
        .bottom-tab .tab-item.active::after {
            width: 32px;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(45, 42, 38, 0.35);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 100;
            display: none;
            align-items: flex-end;
            justify-content: center;
            padding: 16px;
            border-radius: 0;
            overflow: hidden;
        }
        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #FAF7F3;
            border-radius: 20px;
            padding: 20px 16px 24px 16px;
            width: 100%;
            max-width: 520px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(45, 42, 38, 0.2);
            transform: scale(0.92) translateY(20px);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        /* 桌面端：中心缩放淡入 */
        @media (min-width: 768px) {
            .modal-overlay {
                align-items: center;
            }
            .modal-box {
                transform: scale(0.88) translateY(0);
            }
            .modal-overlay.active .modal-box {
                transform: scale(1) translateY(0);
            }
        }

        .modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(45, 42, 38, 0.06);
        }
        .modal-box .modal-header h3 {
            font-size: clamp(1rem, 3.2vw, 1.25rem);
            font-weight: 600;
            color: #2D2A26;
        }
        .modal-box .modal-close {
            background: transparent;
            border: none;
            font-size: 22px;
            color: rgba(45, 42, 38, 0.4);
            cursor: pointer;
            padding: 4px 8px;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-box .modal-close:active {
            transform: scale(0.92);
        }
        .modal-box input[type="text"],
        .modal-box textarea {
            width: 100%;
            padding: 12px 14px;
            font-size: clamp(0.9rem, 2.8vw, 1rem);
            border: 1px solid rgba(45, 42, 38, 0.1);
            border-radius: 12px;
            background: #ffffff;
            color: #2D2A26;
            font-family: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
        }
        .modal-box input[type="text"]:focus,
        .modal-box textarea:focus {
            border-color: #FF6700;
            box-shadow: 0 0 0 3px rgba(255, 103, 0, 0.12);
        }
        .modal-box textarea {
            resize: vertical;
            min-height: 120px;
            line-height: 1.6;
        }
        .modal-box .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 18px;
        }
        .modal-box .modal-actions .btn {
            padding: 10px 24px;
            border-radius: 12px;
            border: none;
            font-size: clamp(0.85rem, 2.6vw, 0.95rem);
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease;
            background: rgba(45, 42, 38, 0.06);
            color: #2D2A26;
        }
        .modal-box .modal-actions .btn:active {
            transform: scale(0.92);
        }
        .modal-box .modal-actions .btn-primary {
            background: #FF6700;
            color: #fff;
        }
        .modal-box .modal-actions .btn-primary:active {
            background: #e65c00;
        }
        .modal-box .edit-save {
            background: transparent;
            border: none;
            font-size: clamp(1rem, 3.2vw, 1.2rem);
            font-weight: 600;
            color: #FF6700;
            cursor: pointer;
            padding: 4px 12px;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-box .edit-save:active {
            transform: scale(0.92);
        }

        /* ===== 回收站 ===== */
        .recycle-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 14px 16px;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid rgba(45, 42, 38, 0.04);
            margin-bottom: 10px;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
            will-change: transform, opacity;
        }
        .recycle-item.removing {
            transform: translateX(-30px);
            opacity: 0;
        }
        .recycle-item .recycle-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }
        .recycle-item .recycle-text {
            font-size: clamp(0.88rem, 2.8vw, 1rem);
            color: #2D2A26;
            word-break: break-word;
            flex: 1;
        }
        .recycle-item .recycle-meta {
            font-size: 0.75rem;
            color: rgba(45, 42, 38, 0.4);
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            margin-top: 4px;
        }
        .recycle-item .recycle-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .recycle-item .recycle-actions button {
            padding: 4px 14px;
            border-radius: 8px;
            border: none;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease;
            background: rgba(45, 42, 38, 0.06);
            color: #2D2A26;
        }
        .recycle-item .recycle-actions button:active {
            transform: scale(0.92);
        }
        .recycle-item .recycle-actions .btn-restore {
            background: rgba(255, 103, 0, 0.12);
            color: #FF6700;
        }
        .recycle-item .recycle-actions .btn-restore:active {
            background: rgba(255, 103, 0, 0.2);
        }
        .recycle-item .recycle-actions .btn-delete {
            background: rgba(200, 60, 60, 0.08);
            color: #b33a3a;
        }
        .recycle-item .recycle-actions .btn-delete:active {
            background: rgba(200, 60, 60, 0.16);
        }

        .recycle-empty {
            text-align: center;
            color: rgba(45, 42, 38, 0.35);
            font-size: 0.95rem;
            padding: 40px 0;
        }

        /* ===== Toast ===== */
        .toast {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(45, 42, 38, 0.85);
            color: #fff;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            z-index: 200;
            white-space: nowrap;
            backdrop-filter: blur(4px);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== 响应式：平板 / 宽屏 ===== */
        @media (min-width: 768px) {
            .main-content {
                padding: 16px 20px 4px 20px;
            }
            .notes-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .fab-group {
                bottom: 20px;
                right: 20px;
            }
            .bottom-tab {
                padding: 4px 20px 10px 20px;
            }
        }

        @media (min-width: 1024px) {
            .main-content {
                padding: 20px 24px 4px 24px;
            }
            .notes-grid {
                gap: 14px;
            }
            .fab-group {
                bottom: 24px;
                right: 24px;
            }
            .bottom-tab {
                padding: 4px 24px 12px 24px;
            }
            .modal-box {
                padding: 24px 24px 28px 24px;
            }
        }

        /* ===== 工具类 ===== */
        .hidden {
            display: none !important;
        }
        .flex-1 {
            flex: 1;
        }
        .relative {
            position: relative;
        }
        .overflow-hidden {
            overflow: hidden;
        }
        .w-full {
            width: 100%;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .gap-8 {
            gap: 8px;
        }

        /* ===== 导入提示 ===== */
        .import-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(45, 42, 38, 0.88);
            color: #fff;
            padding: 16px 28px;
            border-radius: 16px;
            font-size: 0.95rem;
            opacity: 0;
            pointer-events: none;
            z-index: 150;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(4px);
            text-align: center;
        }
        .import-toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

    <div class="app" id="app">

        <!-- ===== Toast ===== -->
        <div class="toast" id="toast"></div>

        <!-- ===== 导入反馈 ===== -->
        <div class="import-toast" id="importToast">导入成功</div>

        <!-- ===== 主内容 ===== -->
        <div class="main-content">

            <!-- ====== 笔记视图 ====== -->
            <div class="view active" id="notesView">
                <div class="view-header">
                    <h2>笔记</h2>
                    <button class="action-btn" id="exportBtn">
                        <span class="btn-text">导出</span>
                        <span class="spinner"></span>
                    </button>
                </div>
                <div class="list-container" id="notesList">
                    <div class="notes-grid" id="notesGrid"></div>
                </div>
                <div class="fab-group">
                    <button class="fab" id="addNoteFab" aria-label="添加笔记">+</button>
                </div>
            </div>

            <!-- ====== 待办视图 ====== -->
            <div class="view" id="todosView">
                <div class="view-header">
                    <h2>待办</h2>
                    <button class="action-btn" id="importBtn">
                        <span class="btn-text">导入</span>
                        <span class="spinner"></span>
                    </button>
                    <input type="file" id="importFileInput" accept=".json" style="display:none" />
                </div>
                <div class="list-container" id="todosList">
                    <div class="todo-list" id="todoList"></div>
                </div>
                <div class="fab-group">
                    <button class="fab fab-secondary" id="recycleBtn" aria-label="回收站">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                            <path d="M10 11v6M14 11v6" />
                        </svg>
                    </button>
                    <button class="fab" id="addTodoFab" aria-label="添加待办">+</button>
                </div>
            </div>

        </div>

        <!-- ===== 底部 Tab ===== -->
        <div class="bottom-tab">
            <button class="tab-item active" data-view="notes">笔记</button>
            <button class="tab-item" data-view="todos">待办</button>
        </div>

        <!-- ===== 编辑笔记模态框 ===== -->
        <div class="modal-overlay" id="editModal">
            <div class="modal-box">
                <div class="modal-header">
                    <h3>编辑笔记</h3>
                    <button class="edit-save" id="saveNoteBtn">✓</button>
                </div>
                <input type="text" id="editTitle" placeholder="请填写标题" />
                <textarea id="editContent" placeholder="请填写内容" class="mt-8"></textarea>
            </div>
        </div>

        <!-- ===== 添加待办模态框 ===== -->
        <div class="modal-overlay" id="todoModal">
            <div class="modal-box">
                <div class="modal-header">
                    <h3>添加待办</h3>
                    <button class="modal-close" id="closeTodoModal">✕</button>
                </div>
                <input type="text" id="todoInput" placeholder="输入待办内容" />
                <div class="modal-actions">
                    <button class="btn" id="cancelTodoBtn">取消</button>
                    <button class="btn btn-primary" id="confirmTodoBtn">添加</button>
                </div>
            </div>
        </div>

        <!-- ===== 回收站模态框 ===== -->
        <div class="modal-overlay" id="recycleModal">
            <div class="modal-box">
                <div class="modal-header">
                    <h3>回收站</h3>
                    <button class="modal-close" id="closeRecycleModal">✕</button>
                </div>
                <div id="recycleList"></div>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        //  JavaScript（完全不变）
        // ============================================================

        (function() {
            'use strict';

            // ---------- 数据 ----------
            const STORAGE_KEY = 'note_todo_data';
            let data = {
                notes: [],
                todos: []
            };

            // ---------- DOM 引用 ----------
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            const notesView = $('#notesView');
            const todosView = $('#todosView');
            const notesGrid = $('#notesGrid');
            const todoList = $('#todoList');
            const recycleList = $('#recycleList');

            const tabItems = $$('.tab-item');
            const addNoteFab = $('#addNoteFab');
            const addTodoFab = $('#addTodoFab');
            const recycleBtn = $('#recycleBtn');

            const editModal = $('#editModal');
            const editTitle = $('#editTitle');
            const editContent = $('#editContent');
            const saveNoteBtn = $('#saveNoteBtn');

            const todoModal = $('#todoModal');
            const todoInput = $('#todoInput');
            const confirmTodoBtn = $('#confirmTodoBtn');
            const cancelTodoBtn = $('#cancelTodoBtn');
            const closeTodoModal = $('#closeTodoModal');

            const recycleModal = $('#recycleModal');
            const closeRecycleModal = $('#closeRecycleModal');

            const exportBtn = $('#exportBtn');
            const importBtn = $('#importBtn');
            const importFileInput = $('#importFileInput');

            const toast = $('#toast');
            const importToast = $('#importToast');

            let editingNoteId = null;
            let toastTimer = null;
            let importToastTimer = null;

            // ---------- 阻止右键 & 选中 ----------
            document.addEventListener('contextmenu', (e) => e.preventDefault());

            // ---------- 工具函数 ----------
            function uid() {
                return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
            }

            function formatTime(ts) {
                const d = new Date(ts);
                return d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0') + ' ' +
                    String(d.getHours()).padStart(2, '0') + ':' +
                    String(d.getMinutes()).padStart(2, '0');
            }

            function formatDate(ts) {
                const d = new Date(ts);
                return d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0');
            }

            function daysBetween(t1, t2) {
                const diff = Math.abs(t2 - t1);
                return Math.ceil(diff / (1000 * 60 * 60 * 24));
            }

            function showToast(msg, duration) {
                duration = duration || 1800;
                if (toastTimer) clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, duration);
            }

            function showImportToast(msg, duration) {
                duration = duration || 1400;
                if (importToastTimer) clearTimeout(importToastTimer);
                importToast.textContent = msg;
                importToast.classList.add('show');
                importToastTimer = setTimeout(() => {
                    importToast.classList.remove('show');
                }, duration);
            }

            // ---------- 存储 ----------
            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        data.notes = parsed.notes || [];
                        data.todos = parsed.todos || [];
                        data.todos.forEach(t => {
                            if (t.isDeleted === undefined) t.isDeleted = false;
                            if (t.deletedAt === undefined) t.deletedAt = null;
                        });
                    }
                } catch (_) { /* ignore */ }
            }

            function saveData() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }

            // ---------- 渲染：笔记 ----------
            function renderNotes() {
                const grid = notesGrid;
                grid.innerHTML = '';
                if (data.notes.length === 0) {
                    grid.innerHTML =
                        '<div style="text-align:center;color:rgba(45,42,38,0.3);padding:40px 0;font-size:0.9rem;">暂无笔记，点击右下角 + 添加</div>';
                    return;
                }
                const sorted = [...data.notes].sort((a, b) => (b.updatedAt || b.createdAt) - (a.updatedAt || a.createdAt));
                sorted.forEach((note, index) => {
                    const card = document.createElement('div');
                    card.className = 'note-card';
                    card.dataset.id = note.id;
                    card.style.transitionDelay = (index * 50) + 'ms';

                    const preview = note.content ? note.content.slice(0, 60) : '';

                    card.innerHTML = `
                        <div class="card-title">${escapeHtml(note.title || '无标题')}</div>
                        <div class="card-preview">${escapeHtml(preview)}${preview.length >= 60 ? '…' : ''}</div>
                        <div class="card-detail-wrap">
                            <div class="card-detail" id="detail_${note.id}"></div>
                            <div class="card-time">更新于 ${formatTime(note.updatedAt || note.createdAt)}</div>
                        </div>
                    `;
                    grid.appendChild(card);

                    const detailContainer = card.querySelector('.card-detail');
                    if (detailContainer) {
                        const lines = (note.content || '').split('\n');
                        lines.forEach((line, idx) => {
                            const span = document.createElement('span');
                            span.className = 'line';
                            if (idx === 0) span.classList.add('indent-0');
                            else if (idx === 1) span.classList.add('indent-2');
                            else span.classList.add('indent-4');
                            span.textContent = line || ' ';
                            detailContainer.appendChild(span);
                        });
                    }

                    card.addEventListener('click', function(e) {
                        if (e.target.closest('.edit-save') || e.target.closest('.modal-close') ||
                            e.target.closest('input') || e.target.closest('textarea') ||
                            e.target.closest('button')) return;
                        const isExpanded = this.classList.contains('expanded');
                        if (isExpanded) {
                            this.classList.remove('expanded');
                            const wrap = this.querySelector('.card-detail-wrap');
                            if (wrap) {
                                wrap.style.height = wrap.scrollHeight + 'px';
                                requestAnimationFrame(() => {
                                    wrap.style.height = '0px';
                                    wrap.style.opacity = '0';
                                });
                            }
                        } else {
                            this.classList.add('expanded');
                            const wrap = this.querySelector('.card-detail-wrap');
                            if (wrap) {
                                wrap.style.height = '0px';
                                wrap.style.opacity = '0';
                                requestAnimationFrame(() => {
                                    wrap.style.height = wrap.scrollHeight + 'px';
                                    wrap.style.opacity = '1';
                                });
                            }
                            this.style.transform = 'scale(0.98)';
                            requestAnimationFrame(() => {
                                this.style.transform = 'scale(1)';
                            });
                        }
                    });

                    card.addEventListener('dblclick', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        openEditNote(id);
                    });

                    requestAnimationFrame(() => {
                        card.classList.add('entered');
                    });
                });
            }

            // ---------- 渲染：待办 ----------
            function renderTodos() {
                const list = todoList;
                list.innerHTML = '';
                const active = data.todos.filter(t => !t.isDeleted);
                if (active.length === 0) {
                    list.innerHTML =
                        '<div style="text-align:center;color:rgba(45,42,38,0.3);padding:40px 0;font-size:0.9rem;">暂无待办，点击右下角 + 添加</div>';
                    return;
                }
                const sorted = [...active].sort((a, b) => a.createdAt - b.createdAt);
                sorted.forEach((todo, index) => {
                    const item = document.createElement('div');
                    item.className = 'todo-item';
                    item.dataset.id = todo.id;
                    item.style.transitionDelay = (index * 50) + 'ms';

                    const checked = todo.isDeleted ? 'checked' : '';
                    const doneClass = todo.isDeleted ? 'done' : '';

                    item.innerHTML = `
                        <div class="checkbox ${checked}" data-id="${todo.id}"></div>
                        <span class="todo-text ${doneClass}">${escapeHtml(todo.text)}</span>
                    `;
                    list.appendChild(item);

                    const cb = item.querySelector('.checkbox');
                    cb.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        completeTodo(id);
                    });

                    requestAnimationFrame(() => {
                        item.classList.add('entered');
                    });
                });
            }

            // ---------- 渲染：回收站 ----------
            function renderRecycle() {
                const list = recycleList;
                list.innerHTML = '';
                const deleted = data.todos.filter(t => t.isDeleted === true);
                if (deleted.length === 0) {
                    list.innerHTML = '<div class="recycle-empty">回收站为空</div>';
                    return;
                }
                const now = Date.now();
                const sorted = [...deleted].sort((a, b) => (b.deletedAt || b.createdAt) - (a.deletedAt || a.createdAt));
                sorted.forEach((todo) => {
                    const days = todo.deletedAt ? daysBetween(todo.deletedAt, now) : 0;
                    const remain = Math.max(0, 30 - days);
                    const div = document.createElement('div');
                    div.className = 'recycle-item';
                    div.dataset.id = todo.id;
                    div.innerHTML = `
                        <div class="recycle-top">
                            <span class="recycle-text">${escapeHtml(todo.text)}</span>
                            <div class="recycle-actions">
                                <button class="btn-restore" data-id="${todo.id}">恢复</button>
                                <button class="btn-delete" data-id="${todo.id}">永久删除</button>
                            </div>
                        </div>
                        <div class="recycle-meta">
                            <span>删除于 ${todo.deletedAt ? formatTime(todo.deletedAt) : '未知'}</span>
                            <span>剩余 ${remain} 天清除</span>
                        </div>
                    `;
                    list.appendChild(div);

                    div.querySelector('.btn-restore').addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        restoreTodo(id);
                    });
                    div.querySelector('.btn-delete').addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        deleteTodoPermanently(id);
                    });
                });
            }

            // ---------- 业务逻辑 ----------
            function addNote(title, content) {
                if (!title.trim() && !content.trim()) return false;
                const note = {
                    id: uid(),
                    title: title.trim() || '无标题',
                    content: content || '',
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                };
                data.notes.push(note);
                saveData();
                renderNotes();
                return true;
            }

            function updateNote(id, title, content) {
                const note = data.notes.find(n => n.id === id);
                if (!note) return false;
                if (!title.trim() && !content.trim()) {
                    deleteNote(id);
                    return true;
                }
                note.title = title.trim() || '无标题';
                note.content = content || '';
                note.updatedAt = Date.now();
                saveData();
                renderNotes();
                return true;
            }

            function deleteNote(id) {
                data.notes = data.notes.filter(n => n.id !== id);
                saveData();
                renderNotes();
            }

            function addTodo(text) {
                if (!text.trim()) return false;
                const todo = {
                    id: uid(),
                    text: text.trim(),
                    createdAt: Date.now(),
                    isDeleted: false,
                    deletedAt: null
                };
                data.todos.push(todo);
                saveData();
                renderTodos();
                return true;
            }

            function completeTodo(id) {
                const todo = data.todos.find(t => t.id === id);
                if (!todo || todo.isDeleted) return;
                const item = document.querySelector(`.todo-item[data-id="${id}"]`);
                if (item) {
                    item.classList.add('removing');
                    setTimeout(() => {
                        todo.isDeleted = true;
                        todo.deletedAt = Date.now();
                        saveData();
                        renderTodos();
                        if (recycleModal.classList.contains('active')) {
                            renderRecycle();
                        }
                    }, 250);
                } else {
                    todo.isDeleted = true;
                    todo.deletedAt = Date.now();
                    saveData();
                    renderTodos();
                    if (recycleModal.classList.contains('active')) {
                        renderRecycle();
                    }
                }
            }

            function restoreTodo(id) {
                const todo = data.todos.find(t => t.id === id);
                if (!todo) return;
                todo.isDeleted = false;
                todo.deletedAt = null;
                saveData();
                const item = document.querySelector(`.recycle-item[data-id="${id}"]`);
                if (item) {
                    item.classList.add('removing');
                    setTimeout(() => {
                        renderRecycle();
                        renderTodos();
                    }, 250);
                } else {
                    renderRecycle();
                    renderTodos();
                }
            }

            function deleteTodoPermanently(id) {
                const todo = data.todos.find(t => t.id === id);
                if (!todo) return;
                data.todos = data.todos.filter(t => t.id !== id);
                saveData();
                const item = document.querySelector(`.recycle-item[data-id="${id}"]`);
                if (item) {
                    item.classList.add('removing');
                    setTimeout(() => {
                        renderRecycle();
                        renderTodos();
                    }, 250);
                } else {
                    renderRecycle();
                    renderTodos();
                }
            }

            function cleanExpiredTodos() {
                const now = Date.now();
                let changed = false;
                data.todos = data.todos.filter(t => {
                    if (t.isDeleted && t.deletedAt) {
                        const days = daysBetween(t.deletedAt, now);
                        if (days >= 30) {
                            changed = true;
                            return false;
                        }
                    }
                    return true;
                });
                if (changed) {
                    saveData();
                    renderRecycle();
                    renderTodos();
                }
            }

            // ---------- 打开编辑笔记 ----------
            function openEditNote(id) {
                let note = null;
                if (id) {
                    note = data.notes.find(n => n.id === id);
                }
                if (note) {
                    editingNoteId = note.id;
                    editTitle.value = note.title || '';
                    editContent.value = note.content || '';
                } else {
                    editingNoteId = null;
                    editTitle.value = '';
                    editContent.value = '';
                }
                editModal.classList.add('active');
                setTimeout(() => editTitle.focus(), 100);
            }

            function closeEditNote() {
                editModal.classList.remove('active');
                editingNoteId = null;
            }

            // ---------- 打开回收站 ----------
            function openRecycle() {
                renderRecycle();
                recycleModal.classList.add('active');
            }

            function closeRecycle() {
                recycleModal.classList.remove('active');
            }

            // ---------- 导入导出 ----------
            function exportData() {
                const btn = exportBtn;
                btn.classList.add('loading');
                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'note_todo_backup_' + formatDate(Date.now()) + '.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                setTimeout(() => {
                    btn.classList.remove('loading');
                    showToast('导出成功');
                }, 500);
            }

            function importData(file) {
                const reader = new FileReader();
                const btn = importBtn;
                btn.classList.add('loading');
                reader.onload = function(e) {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (!imported.notes || !imported.todos) {
                            throw new Error('无效数据格式');
                        }
                        if (!confirm('导入将完全替换当前所有数据，确认继续？')) {
                            btn.classList.remove('loading');
                            return;
                        }
                        data.notes = imported.notes || [];
                        data.todos = imported.todos || [];
                        data.todos.forEach(t => {
                            if (t.isDeleted === undefined) t.isDeleted = false;
                            if (t.deletedAt === undefined) t.deletedAt = null;
                        });
                        saveData();
                        renderNotes();
                        renderTodos();
                        if (recycleModal.classList.contains('active')) {
                            renderRecycle();
                        }
                        btn.classList.remove('loading');
                        showImportToast('导入成功');
                    } catch (err) {
                        btn.classList.remove('loading');
                        showToast('导入失败：' + err.message);
                    }
                };
                reader.onerror = function() {
                    btn.classList.remove('loading');
                    showToast('读取文件失败');
                };
                reader.readAsText(file);
            }

            // ---------- 工具：转义HTML ----------
            function escapeHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ---------- 切换Tab ----------
            function switchTab(view) {
                tabItems.forEach(tab => {
                    const v = tab.dataset.view;
                    tab.classList.toggle('active', v === view);
                });
                if (view === 'notes') {
                    notesView.classList.add('active');
                    todosView.classList.remove('active');
                    notesView.style.animation = 'none';
                    requestAnimationFrame(() => {
                        notesView.style.animation = 'viewFadeIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
                    });
                } else {
                    todosView.classList.add('active');
                    notesView.classList.remove('active');
                    todosView.style.animation = 'none';
                    requestAnimationFrame(() => {
                        todosView.style.animation = 'viewFadeIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
                    });
                }
            }

            // ---------- 初始化 ----------
            function init() {
                loadData();
                cleanExpiredTodos();
                renderNotes();
                renderTodos();

                tabItems.forEach(tab => {
                    tab.addEventListener('click', function() {
                        const view = this.dataset.view;
                        switchTab(view);
                    });
                });

                addNoteFab.addEventListener('click', function() {
                    openEditNote(null);
                });

                saveNoteBtn.addEventListener('click', function() {
                    const title = editTitle.value;
                    const content = editContent.value;
                    if (!title.trim() && !content.trim()) {
                        showToast('内容为空，未保存');
                        closeEditNote();
                        return;
                    }
                    if (editingNoteId) {
                        updateNote(editingNoteId, title, content);
                    } else {
                        addNote(title, content);
                    }
                    closeEditNote();
                    showToast('已保存');
                });

                editModal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        closeEditNote();
                    }
                });

                addTodoFab.addEventListener('click', function() {
                    todoModal.classList.add('active');
                    setTimeout(() => todoInput.focus(), 100);
                });

                function confirmAddTodo() {
                    const text = todoInput.value.trim();
                    if (text) {
                        addTodo(text);
                        todoInput.value = '';
                        todoModal.classList.remove('active');
                        showToast('已添加');
                    } else {
                        showToast('请输入内容');
                    }
                }

                confirmTodoBtn.addEventListener('click', confirmAddTodo);
                cancelTodoBtn.addEventListener('click', function() {
                    todoModal.classList.remove('active');
                    todoInput.value = '';
                });
                closeTodoModal.addEventListener('click', function() {
                    todoModal.classList.remove('active');
                    todoInput.value = '';
                });
                todoModal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        todoModal.classList.remove('active');
                        todoInput.value = '';
                    }
                });
                todoInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        confirmAddTodo();
                    }
                });

                recycleBtn.addEventListener('click', openRecycle);
                closeRecycleModal.addEventListener('click', closeRecycle);
                recycleModal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        closeRecycle();
                    }
                });

                exportBtn.addEventListener('click', exportData);

                importBtn.addEventListener('click', function() {
                    importFileInput.click();
                });
                importFileInput.addEventListener('change', function(e) {
                    if (this.files && this.files[0]) {
                        importData(this.files[0]);
                    }
                    this.value = '';
                });

                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') {
                        if (editModal.classList.contains('active')) closeEditNote();
                        if (todoModal.classList.contains('active')) {
                            todoModal.classList.remove('active');
                            todoInput.value = '';
                        }
                        if (recycleModal.classList.contains('active')) closeRecycle();
                    }
                    if (e.key === 's' && (e.ctrlKey || e.metaKey)) {
                        if (editModal.classList.contains('active')) {
                            e.preventDefault();
                            saveNoteBtn.click();
                        }
                    }
                });

                setInterval(cleanExpiredTodos, 60000);

                notesGrid.addEventListener('dblclick', function(e) {
                    const card = e.target.closest('.note-card');
                    if (card) {
                        const id = card.dataset.id;
                        if (id) openEditNote(id);
                    }
                });

                document.querySelectorAll('.modal-overlay, .modal-box').forEach(el => {
                    el.addEventListener('contextmenu', (e) => e.preventDefault());
                });

                switchTab('notes');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
